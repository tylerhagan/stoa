name: BiS lists

# Once a week, rebuilds Data/BiS.lua from the latest WoWSims Forever gear
# sets and opens a pull request when any list changed. The date and commit
# lines alone don't count as a change.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch WoWSims Forever
        run: git clone --depth 1 https://github.com/wowsims/forever.git "$RUNNER_TEMP/wowsims"

      - name: Rebuild the lists
        run: python3 Tools/bis/build.py "$RUNNER_TEMP/wowsims"

      - name: Open a pull request if a list changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -I '^\s*(date|commit) = ' -- Data/BiS.lua; then
            echo "No list changed."
            exit 0
          fi
          branch="bis/update-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Data/BiS.lua
          git commit -m "Update BiS lists from WoWSims Forever"
          git push -f origin "$branch"
          gh pr create --title "Update BiS lists from WoWSims Forever" \
            --body "Weekly rebuild of Data/BiS.lua from the WoWSims Forever gear sets. Check the diff, then merge." \
            --base main --head "$branch" || echo "A pull request for this branch is already open."
