name: Docs

# Fails when README.md or CHANGELOG.md changed without rebuilding the docs site.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 Tools/docs/build.py --check
