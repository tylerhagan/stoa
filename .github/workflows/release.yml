name: Release

# Runs when a version tag such as v0.9.1 is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the TOC version matches the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          toc_version="$(sed -n 's/^## Version:[[:space:]]*//p' Stoa.toc | tr -d '\r' | head -n 1)"
          if [ "$tag_version" != "$toc_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Stoa.toc version '$toc_version'"
            exit 1
          fi
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Take release notes from CHANGELOG.md
        run: |
          # Lines under "## <version>" up to the next "## " heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v || $2 == "[" v "]") { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section (or an empty one) for $VERSION"
            exit 1
          fi
          cat notes.md

      - name: Build the zip
        run: Tools/package.sh "$GITHUB_SHA"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/Stoa-$VERSION.zip" \
            --title "STOA $VERSION" \
            --notes-file notes.md \
            --verify-tag

      # Uploads the same zip to CurseForge (project 1772375, read from the TOC).
      # Needs the repository secret CF_API_KEY. The game version is matched by
      # name: set the repository variable CF_GAME_VERSION (e.g. the name the
      # CurseForge upload page shows for WoW Forever). Runs after the GitHub
      # Release, so a CurseForge problem never blocks it.
      - name: Upload to CurseForge
        if: ${{ env.CF_API_KEY != '' }}
        env:
          CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
        run: |
          project_id="$(sed -n 's/^## X-Curse-Project-ID:[[:space:]]*//p' Stoa.toc | tr -d '\r' | head -n 1)"
          api="https://wow.curseforge.com/api"
          curl -fsS -H "X-Api-Token: $CF_API_KEY" "$api/game/versions" > versions.json
          version_id="$(jq --arg n "$CF_GAME_VERSION" '[.[] | select(.name == $n) | .id] | first // empty' versions.json)"
          if [ -z "$CF_GAME_VERSION" ] || [ -z "$version_id" ]; then
            echo "::error::Set the repository variable CF_GAME_VERSION to one of these names:"
            jq -r '.[].name' versions.json | sort -u | tail -n 80
            exit 1
          fi
          jq -n --rawfile notes notes.md --arg name "STOA $VERSION" --argjson v "$version_id" \
            '{changelog: $notes, changelogType: "markdown", displayName: $name, gameVersions: [$v], releaseType: "release"}' > metadata.json
          curl -fsS -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=<metadata.json" \
            -F "file=@dist/Stoa-$VERSION.zip" \
            "$api/projects/$project_id/upload-file"
