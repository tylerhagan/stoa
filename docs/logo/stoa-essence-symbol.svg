<svg xmlns="http://www.w3.org/2000/svg" viewBox="575 55 240 240" fill="none" role="img" aria-labelledby="title desc">
<title id="title">STOA — Essence symbol</title><desc id="desc">Slender gold oval, with a luminous horizontal horizon within the O.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="0.15" y2="1"><stop stop-color="#F6D798"/><stop offset=".32" stop-color="#E9C17A"/><stop offset=".68" stop-color="#D8A65D"/><stop offset="1" stop-color="#AD7738"/></linearGradient>
 <linearGradient id="horizon" gradientUnits="userSpaceOnUse" x1="619.4" y1="219" x2="770.6" y2="219"><stop stop-color="#BF8D49"/><stop offset=".35" stop-color="#EBC680"/><stop offset=".5" stop-color="#FFF0BF"/><stop offset=".65" stop-color="#EBC680"/><stop offset="1" stop-color="#BF8D49"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#FFE5A2" stop-opacity=".65"/><stop offset=".3" stop-color="#EDBA68" stop-opacity=".24"/><stop offset="1" stop-color="#D69A45" stop-opacity="0"/></radialGradient>
</defs>

<g stroke="url(#gold)" stroke-width="9" stroke-linecap="butt" stroke-linejoin="miter"><ellipse cx="695" cy="175" rx="88" ry="86"/></g>
